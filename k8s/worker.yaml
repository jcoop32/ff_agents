apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
  namespace: gridiron-ai
  labels:
    app: gridiron-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gridiron-worker
  template:
    metadata:
      labels:
        app: gridiron-worker
    spec:
      nodeSelector:
        kubernetes.io/hostname: node-5
      containers:
        - name: worker
          image: jcooper23/gridiron-ai:latest
          imagePullPolicy: Always
          command: ["python", "-m", "app.worker"]
          env:
            - name: REDIS_URL
              value: redis://redis.gridiron-ai.svc.cluster.local:6379/0
          envFrom:
            - secretRef:
                name: gridiron-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
