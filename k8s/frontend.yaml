apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: gridiron-ai
  labels:
    app: gridiron-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gridiron-ui
  template:
    metadata:
      labels:
        app: gridiron-ui
    spec:
      nodeSelector:
        kubernetes.io/hostname: node-5
      containers:
        - name: frontend
          image: jcooper23/gridiron-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            # In-cluster internal DNS used for any server-side communication
            - name: INTERNAL_API_URL
              value: "http://gridiron-service.gridiron-ai.svc.cluster.local:8000"
            # Client browser accesses backend directly via Tailscale NodePort 31080
            - name: NEXT_PUBLIC_API_URL
              value: ""
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gridiron-ui-service
  namespace: gridiron-ai
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 31081
      name: http
  selector:
    app: gridiron-ui
