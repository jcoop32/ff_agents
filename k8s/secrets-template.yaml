apiVersion: v1
kind: Secret
metadata:
  name: gridiron-secrets
  namespace: gridiron-ai
type: Opaque
stringData:
  # Database Credentials
  POSTGRES_USER: "gridiron"
  POSTGRES_PASSWORD: "CHANGE_ME_DATABASE_PASSWORD"
  DATABASE_URL: "postgresql+asyncpg://gridiron:CHANGE_ME_DATABASE_PASSWORD@postgres.gridiron-ai.svc.cluster.local:5432/gridiron"

  # Cloud LLM API Keys (Free Tier)
  GOOGLE_API_KEY: "CHANGE_ME_GOOGLE_AI_STUDIO_KEY"
  GROQ_API_KEY: "CHANGE_ME_GROQ_KEY"

  # ESPN Fantasy Auth (Private League)
  ESPN_LEAGUE_ID: "CHANGE_ME_ESPN_LEAGUE_ID"
  ESPN_TEAM_ID: "CHANGE_ME_ESPN_TEAM_ID"
  ESPN_S2: "CHANGE_ME_ESPN_S2_COOKIE"
  ESPN_SWID: "CHANGE_ME_ESPN_SWID_COOKIE"
  ESPN_YEAR: "2026"

  # Discord Bot Relay (Optional - leaves bot idle if omitted)
  DISCORD_BOT_TOKEN: "CHANGE_ME_DISCORD_BOT_TOKEN"
  DISCORD_CHANNEL_ID: "CHANGE_ME_DISCORD_CHANNEL_ID"
  DISCORD_ALERTS_CHANNEL_ID: "CHANGE_ME_DISCORD_ALERTS_CHANNEL_ID"
  DISCORD_DIGEST_CHANNEL_ID: "CHANGE_ME_DISCORD_DIGEST_CHANNEL_ID"
  DISCORD_USER_ID: "CHANGE_ME_DISCORD_USER_ID"

  # League & Scoring Settings
  LEAGUE_SIZE: "10"
  SCORING_FORMAT: "ppr"
  NUM_WR_SLOTS: "3"
  HAS_FLEX: "true"
  PASSING_YARDS_PER_POINT: "20.0"
  IS_SUPERFLEX: "false"
  IS_TE_PREMIUM: "false"
  BENCH_SLOTS: "4"
  IR_SLOTS: "1"
